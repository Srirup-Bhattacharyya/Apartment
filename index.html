<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apartment Maintenance Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="loginScreen" class="login-shell">
    <div class="login-art">
      <div class="login-brand">SA</div>
      <div class="login-illustration" aria-hidden="true"><span class="sun"></span><span class="leaf leaf-one"></span><span class="leaf leaf-two"></span><span class="flower flower-one"></span><span class="flower flower-two"></span><span class="home-shape">⌂</span></div>
      <h1>Simple apartment<br><em>accounts.</em></h1>
      <p class="login-copy">Keep monthly maintenance, balances and receipts organized for every home.</p>
    </div>
    <form id="loginForm" class="login-card">
      <div class="login-wordmark">Shraddhanjalli</div>
      <p class="login-welcome">Welcome back</p>
      <label>Username or Email<input id="loginUsername" required autocomplete="username" placeholder="Enter your username"></label>
      <label>Password<input id="loginPassword" required type="password" autocomplete="current-password" placeholder="Enter your password"></label>
      <button class="login-submit" type="submit">Sign in</button>
      <p id="loginError" class="form-error"></p>
      <div class="login-divider"><span>or</span></div>
      <p class="login-note">Use your apartment account credentials to continue.</p>
    </form>
  </div>

  <div id="appShell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand-row"><div class="brand-mark small">SA</div><span>Maintenance<br><b>Desk</b></span></div>
      <div id="managerBadge" class="manager-badge"></div>
      <nav id="mainNav">
        <button class="nav-item active" data-view="overview"><span>⌂</span> Overview</button>
        <button class="nav-item manager-only" data-view="members"><span>♙</span> Members</button>
        <button class="nav-item" data-view="payments"><span>↗</span> Payments</button>
        <button class="nav-item" data-view="wallet"><span>◈</span> Wallet</button>
        <button class="nav-item" data-view="receipts"><span>▤</span> Receipts</button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item manager-only" data-view="settings"><span>⚙</span> Settings</button>
        <button id="logoutBtn" class="nav-item logout"><span>↪</span> Log out</button>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar"><div><p class="eyebrow">NOVEMBER 2026 BILLING CYCLE</p><h1 id="pageTitle">Good morning, manager</h1></div><div class="top-actions"><button id="quickPayBtn" class="primary">＋ Record payment</button><div id="userAvatar" class="avatar">AM</div></div></header>
      <div id="toast" class="toast"></div>
      <section id="view-overview" class="view"></section>
      <section id="view-members" class="view hidden"></section>
      <section id="view-payments" class="view hidden"></section>
      <section id="view-wallet" class="view hidden"></section>
      <section id="view-receipts" class="view hidden"></section>
      <section id="view-settings" class="view hidden"></section>
    </main>
  </div>

  <div id="modalRoot"></div>
  <script src="app.js"></script>
</body>
</html>
