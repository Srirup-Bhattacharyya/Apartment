services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: shraddhanjalli
      MARIADB_USER: maintenance
      MARIADB_PASSWORD: change-me
      MARIADB_ROOT_PASSWORD: change-root-password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
